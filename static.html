<!DOCTYPE html>
<html>
<head>
    <title>Static Webpage</title>

    <!-- Internal CSS -->
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Header */
        .header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Navigation */
        .nav {
            background-color: #34495e;
            padding: 10px;
            text-align: center;
        }

        .nav a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        .nav a:hover {
            color: yellow;
        }

        /* Layout */
        .container {
            display: flex;
        }

        .left {
            width: 20%;
            background: #d5f5e3;
            padding: 10px;
        }

        .content {
            width: 60%;
            padding: 20px;
        }

        .right {
            width: 20%;
            background: #f9e79f;
            padding: 10px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>My Website</h1>
    </div>

    <!-- Navigation -->
    <div class="nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>

    <!-- Main Layout -->
    <div class="container">

        <!-- Left Section -->
        <div class="left">
            <h3>Contents</h3>
            <ul>
                <li>Introduction</li>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
            </ul>
        </div>

        <!-- Center Content -->
        <div class="content">
            <h2>Welcome</h2>
            <p>This is the main content area.</p>

            <p>Layout division:</p>
            <ul>
                <li>20% Left</li>
                <li>60% Center</li>
                <li>20% Right</li>
            </ul>
        </div>

        <!-- Right Section (Inline CSS used) -->
        <div class="right">
            <h3 style="color:red;">Remarks</h3>
            <p style="font-family:Arial;">
                This section is used for notes or remarks.
            </p>
        </div>

    </div>

</body>
</html>
