<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chalk Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">

    <h1>Calculator</h1>

    <div class="heading-row">
      <div>1st Num</div>
      <div>2nd Num</div>
      <div>Result</div>
    </div>

    <div class="calculator-box">

      <div class="numbers-section">
        <input type="text" id="num1" placeholder="1st Number" readonly>
        <input type="text" id="num2" placeholder="2nd Number" readonly>

        <div class="number-pad">
          <button onclick="addNumber('1')">1</button>
          <button onclick="addNumber('2')">2</button>
          <button onclick="addNumber('3')">3</button>

          <button onclick="addNumber('4')">4</button>
          <button onclick="addNumber('5')">5</button>
          <button onclick="addNumber('6')">6</button>

          <button onclick="addNumber('7')">7</button>
          <button onclick="addNumber('8')">8</button>
          <button onclick="addNumber('9')">9</button>

          <button class="zero-btn" onclick="addNumber('0')">0</button>
        </div>

        <div class="result-box" id="resultBox">
          Result = 0
        </div>
      </div>

      <div class="operator-section">
        <button onclick="calculate('+')">+</button>
        <button onclick="calculate('-')">−</button>
        <button onclick="calculate('*')">×</button>
        <button onclick="calculate('/')">÷</button>
      </div>

    </div>

    <button class="clear-btn" onclick="clearAll()">Clear</button>

    <p class="author">Made by Sudhanshu Kumar</p>

  </div>

  <script src="script.js"></script>
</body>
</html>
